version: "3.8"
services:
  warp-proxy:
    build: .
    container_name: warp-proxy
    # Explicitly drop all Linux kernel capabilities
    cap_drop:
      - ALL
    # Prevent the container from gaining new privileges
    security_opt:
      - no-new-privileges:true
    ports:
      - "40000:40000"
    environment:
      - PROXY_PORT=40000
    restart: unless-stopped
